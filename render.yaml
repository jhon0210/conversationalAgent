services:
  - type: web
    name: registro-proveedor-agente
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: openai   # API compatible con OpenAI (Gemini por defecto); usar anthropic para Claude
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: LLM_API_KEY
        sync: false     # se carga en el panel de Render; nunca en el repositorio
      - key: LLM_MODEL
        sync: false     # p. ej. el mismo id que usas en tu .env local
      - key: MAX_ITERACIONES
        value: "25"
      - key: MAX_TOKENS_SESION
        value: "150000"
      - key: LLM_TIMEOUT_MS
        value: "60000"
      - key: DIAS_AVISO_VENCIMIENTO
        value: "30"
      # Dejar vacío para usar la fecha del sistema; fijarla solo para demostraciones reproducibles.
      - key: FECHA_EJECUCION
        value: ""
