services:
  - type: web
    name: registro-proveedor-agente
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: anthropic   # cambiar a openai para Gemini, GitHub Models, etc.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: claude-sonnet-4-5
      - key: MAX_ITERACIONES
        value: "25"
      - key: MAX_TOKENS_SESION
        value: "150000"
      - key: LLM_TIMEOUT_MS
        value: "60000"
      - key: DIAS_AVISO_VENCIMIENTO
        value: "30"
      # Dejar vacío para usar la fecha del sistema; fijarla solo para demostraciones reproducibles.
      - key: FECHA_EJECUCION
        value: ""
